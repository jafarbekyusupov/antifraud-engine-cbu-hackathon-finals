services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - antifraud-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - database
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DATA_DIR: /app/data
      RESULT_DIR: /app/natija
      CREATE_REPLAY_CHALLENGES: ${CREATE_REPLAY_CHALLENGES:-false}
      SECURITY_CHALLENGE_TTL_SECONDS: ${SECURITY_CHALLENGE_TTL_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data:ro
      - ./natija:/app/natija
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - public
      - database
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  antifraud-postgres:

networks:
  public:
  database:
    internal: true
